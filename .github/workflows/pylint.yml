name: Lint & tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the version used to build the release apps
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest

      - name: Pylint code check
        # *.pyw too: EHentaiDownloader.pyw is the program's entry point
        run: |
          python -m pylint --disable=broad-exception-caught $(git ls-files '*.py' '*.pyw' ':!:tests/*')

      - name: Pylint test check
        run: |
          python -m pylint --disable=broad-exception-caught,missing-function-docstring,missing-class-docstring,import-outside-toplevel,protected-access tests

      - name: Tests
        run: python -m pytest -q
