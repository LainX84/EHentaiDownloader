name: Build release

# Builds the ready-to-use app for Windows, macOS (Apple Silicon + Intel) and Linux.
#  - Push a tag "v<version>" (e.g. v2.0.0): the archives are attached to a new GitHub release.
#  - "Run workflow" from the Actions tab: test build, archives downloadable from the run page.
#
# The macOS Apple Silicon build is optional: GitHub's arm64 runners are sometimes out of
# capacity and the job is never picked up. In that case the release is still published
# with the other archives; the arm64 one can be added later by re-running the failed job
# and uploading its archive to the release by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: macos-latest
            label: macOS Apple Silicon
            optional: true          # see the note at the top
          - os: macos-15-intel
            label: macOS Intel
          - os: ubuntu-22.04        # older glibc: the binary also runs on older distributions
            label: Linux x64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.22,<7"

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/build.py

      - name: Upload archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    # !cancelled(): run even if the optional arm64 build failed; the check below
    # still stops the release if one of the required archives is missing.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Check required archives
        shell: bash
        run: |
          ls -l release
          missing=0
          for pattern in "*-windows-x64.zip" "*-macos-x64.zip" "*-linux-x64.tar.gz"; do
            if ! compgen -G "release/$pattern" > /dev/null; then
              echo "::error::Missing required archive: $pattern"
              missing=1
            fi
          done
          if ! compgen -G "release/*-macos-arm64.zip" > /dev/null; then
            echo "::warning::macOS Apple Silicon archive missing: the release is published without it"
          fi
          exit $missing

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
