name: Build release

# Builds the ready-to-use app for Windows, macOS (Apple Silicon + Intel) and Linux.
#  - Push a tag "v<version>" (e.g. v2.0.0): the archives are attached to a new GitHub release.
#  - "Run workflow" from the Actions tab: test build, archives downloadable from the run page.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
          - os: macos-latest
            label: macOS Apple Silicon
          - os: macos-15-intel
            label: macOS Intel
          - os: ubuntu-22.04        # older glibc: the binary also runs on older distributions
            label: Linux x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.22,<7"

      - name: Build
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/build.py

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
